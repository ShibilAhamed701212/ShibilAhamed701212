name: Update stats graphic

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build assets/github-3d.svg
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_TOKEN_SET: ${{ secrets.STATS_TOKEN != '' && '1' || '' }}
        run: python scripts/build_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-3d.svg README.md
          git diff --cached --quiet || (git commit -m "chore: refresh GitHub stats graphic" && git push)
